  <body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary-fixed selection:text-tertiary">
    <div id="root"></div>
    <script>
      // Universal Image Fallback Safeguard: guarantees no broken image is ever displayed
      window.addEventListener('error', function(event) {
        if (event.target && event.target.tagName === 'IMG') {
          var img = event.target;
          if (!img.dataset.fallbackApplied) {
            img.dataset.fallbackApplied = 'true';
            img.src = '/images/products/zeytinyagi-main.jpg';
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
